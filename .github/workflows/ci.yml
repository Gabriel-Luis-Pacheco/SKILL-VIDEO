name: skill-integrity
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skill structure
        run: python skills/ai-video-director/scripts/validate.py
      - name: Verify shotlist
        run: python skills/ai-video-director/scripts/shotlist_lint.py skills/ai-video-director/fixtures/valid_shotlist.json --release
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
