name: skill-integrity
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install media renderer dependencies
        run: |
          python -m pip install --disable-pip-version-check Pillow
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1
          command -v ffprobe
      - name: Compile Python tools
        run: python -m compileall -q skills/ai-video-director/scripts tests
      - name: Validate skill structure
        run: python skills/ai-video-director/scripts/validate.py
      - name: Verify shotlist
        run: python skills/ai-video-director/scripts/shotlist_lint.py skills/ai-video-director/fixtures/valid_shotlist.json --release
      - name: Compile frame-accurate storyboard
        run: python skills/ai-video-director/scripts/timeline_compile.py skills/ai-video-director/fixtures/storyboard.json -o /tmp/video-os-timeline.json
      - name: Validate controlled advertising variants
        run: python skills/ai-video-director/scripts/campaign_matrix.py skills/ai-video-director/fixtures/campaign_matrix.json
      - name: Validate example captions
        run: python skills/ai-video-director/scripts/captions_lint.py skills/ai-video-director/fixtures/sample.srt
      - name: Production preflight (preview, not release)
        run: python skills/ai-video-director/scripts/production_gate.py skills/ai-video-director/fixtures/storyboard.json skills/ai-video-director/fixtures/assets.json --project-root skills/ai-video-director
      - name: Verify goal routing, campaign analytics and review contract
        run: |
          python skills/ai-video-director/scripts/brief_router.py skills/ai-video-director/fixtures/brief_synthetic.json
          python skills/ai-video-director/scripts/campaign_results.py skills/ai-video-director/fixtures/campaign_results_synthetic.json
          python skills/ai-video-director/scripts/independent_review.py skills/ai-video-director/fixtures/review_synthetic.json
      - name: Verify new-project scaffold is draft only
        run: |
          python skills/ai-video-director/scripts/new_video_project.py --out /tmp/video-os-new-project --title "Test Film" --brand "Test Studio" --goal conversion --surface reels
          test -s /tmp/video-os-new-project/brief.json
          test -s /tmp/video-os-new-project/storyboard.json
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Render a real, original 7s film (CI smoke)
        run: |
          python skills/ai-video-director/examples/rendered-proof/render.py --output /tmp/video-os-smoke.mp4 --width 270 --height 480 --fps 12 --stills /tmp/video-os-frames
          python skills/ai-video-director/scripts/video_qc.py /tmp/video-os-smoke.mp4 --duration 7 --aspect 9:16 --require-audio
          test "$(find /tmp/video-os-frames -name '*.png' | wc -l)" -eq 5
      - name: Capture actual rendered frames and create review evidence
        run: |
          python skills/ai-video-director/scripts/evidence_capture.py /tmp/video-os-smoke.mp4 --out /tmp/video-os-review --max-frames 9 --thumb-width 150
          test -s /tmp/video-os-review/contact-sheet.jpg
          test -s /tmp/video-os-review/evidence.json
      - name: Upload preview video and evidence (technical proof)
        uses: actions/upload-artifact@v4
        with:
          name: video-os-rendered-smoke
          path: |
            /tmp/video-os-smoke.mp4
            /tmp/video-os-review/contact-sheet.jpg
            /tmp/video-os-review/evidence.json
          retention-days: 7
